<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- track ring (light) -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#D6E4F0" stroke-width="22"/>

  <!-- PROGRESS RING: fills 0->100% over 40s, solid Motiva navy -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#1A365D" stroke-width="22"
          stroke-linecap="round" stroke-dasharray="942.48"
          stroke-dashoffset="942.48"
          transform="rotate(-90 200 200)">
    <animate attributeName="stroke-dashoffset"
             values="942.48;0" dur="40s"
             begin="0s" fill="freeze" calcMode="linear"/>
  </circle>

  <!-- orbiting green end-effector dot, blinking -->
  <g transform="rotate(-90 200 200)">
    <animateTransform attributeName="transform" type="rotate"
                      values="-90 200 200;270 200 200" dur="40s"
                      begin="0s" fill="freeze" calcMode="linear"/>
    <circle cx="350" cy="200" r="16" fill="#2F855A" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="200" r="7" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
