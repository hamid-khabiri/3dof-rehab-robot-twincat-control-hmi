<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#1A365D"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- track ring (light) -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#D6E4F0" stroke-width="22"/>

  <!-- PROGRESS RING: fills 0->100% over 40s, black->navy gradient -->
  <!-- circumference = 2*pi*150 = 942.48 -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="22"
          stroke-linecap="round" stroke-dasharray="942.48"
          stroke-dashoffset="942.48"
          transform="rotate(-90 200 200)">
    <animate attributeName="stroke-dashoffset"
             values="942.48;0" dur="40s"
             begin="0s" fill="freeze" calcMode="linear"/>
  </circle>

  <!-- MOTIVA orbiting end-effector dot: rides the ring tip, blinking green -->
  <g transform="rotate(-90 200 200)">
    <animateTransform attributeName="transform" type="rotate"
                      values="-90 200 200;270 200 200" dur="40s"
                      begin="0s" fill="freeze" calcMode="linear"/>
    <circle cx="350" cy="200" r="16" fill="#2F855A" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="200" r="7" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- center: counting percent only (no MOTIVA, no subtitle) -->
  <text id="pct" x="200" y="218" font-family="Segoe UI, system-ui, sans-serif" font-weight="800"
        font-size="64" fill="#1A365D" text-anchor="middle">0%</text>

  <script type="text/javascript"><![CDATA[
    (function(){
      var el = document.getElementById('pct');
      var dur = 40000;
      var start = null;
      function step(ts){
        if(!start) start = ts;
        var t = ts - start;
        var p = Math.min(100, Math.floor((t/dur)*100));
        el.textContent = p + '%';
        if(p >= 100){ el.textContent = '100%'; return; }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  ]]></script>
</svg>
