  <path d="M 50 46 C 50 46 20 54 20 74 L 20 92 L 80 92 L 80 74 C 80 54 50 46 50 46 Z"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-dasharray="8 4" stroke-linejoin="round"/>
