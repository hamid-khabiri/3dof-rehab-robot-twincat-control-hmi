<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 365" width="320" height="365">
  <!-- Earpiece tips -->
  <circle cx="93" cy="18" r="7" fill="#1A365D"/>
  <circle cx="177" cy="18" r="7" fill="#1A365D"/>

  <!-- Earpiece tubes up -->
  <path d="M 93 18 L 93 32" fill="none" stroke="#1A365D" stroke-width="5" stroke-linecap="round"/>
  <path d="M 177 18 L 177 32" fill="none" stroke="#1A365D" stroke-width="5" stroke-linecap="round"/>

  <!-- Y-tubes converging -->
  <path d="M 93 32 Q 93 78 135 84" fill="none" stroke="#1A365D" stroke-width="5" stroke-linecap="round"/>
  <path d="M 177 32 Q 177 78 135 84" fill="none" stroke="#1A365D" stroke-width="5" stroke-linecap="round"/>

  <!-- Center connector -->
  <rect x="130" y="79" width="10" height="22" rx="3" fill="#1A365D"/>

  <!-- Main tube with loop -->
  <path d="M 135 101
           C 135 139, 75 149, 75 189
           C 75 229, 120 239, 140 219
           C 160 199, 120 189, 120 219
           C 120 249, 185 269, 225 269
           C 265 269, 265 239, 265 219"
        fill="none" stroke="#1A365D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connection to ring -->
  <line x1="265" y1="219" x2="265" y2="272" stroke="#1A365D" stroke-width="5" stroke-linecap="round"/>

  <!-- Motiva ring = chest piece -->
  <circle cx="265" cy="310" r="32" fill="none" stroke="#1A365D" stroke-width="7"/>

  <!-- Orbiting green end-effector dot -->
  <circle cx="265" cy="278" r="7" fill="#2F855A">
    <animateTransform attributeName="transform" type="rotate"
      from="0 265 310" to="360 265 310" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle pulse at ring center -->
  <circle cx="265" cy="310" r="3" fill="#2F855A" opacity="0.4">
    <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
